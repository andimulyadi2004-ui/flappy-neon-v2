plugins {
    id 'com.android.application'
}

android {
    namespace 'org.gue.flappyneon'
    compileSdk 34

    defaultConfig {
        applicationId "org.gue.flappyneon"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
        debug { }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
